<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser AI Audio Noise Remover</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #4fc3f7; }
        .btn {
            background-color: #00e676;
            color: #121214;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px 0;
            width: 100%;
        }
        .btn:hover { background-color: #00b359; }
        .btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .status { margin: 15px 0; font-style: italic; color: #ffb300; min-height: 20px; }
        .audio-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid #333; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #00e676; text-align: left; }
        audio { width: 100%; margin-bottom: 10px; }
    </style>
    
    <!-- FIX: Loading Jitsi's sync version which contains the compiled WASM inlined as a Base64 string -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h1>AI Noise Remover</h1>
    <p>Upload a noisy voice recording to clean it entirely offline inside your browser.</p>
    
    <input type="file" id="audioInput" accept="audio/*" style="display: none;">
    <button class="btn" id="uploadBtn">Select Audio File</button>
    <button class="btn" id="processBtn" disabled>Clean Audio with AI</button>
    
    <div class="status" id="statusText">Initializing AI Engine...</div>

    <div class="audio-section" id="audioOutputs" style="display: none;">
        <label>Original Noisy Audio</label>
        <audio id="originalAudio" controls></audio>
        
        <label style="margin-top: 15px;">AI Enhanced Clean Audio</label>
        <audio id="cleanedAudio" controls></audio>
    </div>
</div>

<script>
    const uploadBtn = document.getElementById('uploadBtn');
    const audioInput = document.getElementById('audioInput');
    const processBtn = document.getElementById('processBtn');
    const statusText = document.getElementById('statusText');
    const audioOutputs = document.getElementById('audioOutputs');
    const originalAudio = document.getElementById('originalAudio');
    const cleanedAudio = document.getElementById('cleanedAudio');

    let audioBuffer = null;
    let rnnoiseModule = null;

    // Initialize the module immediately on page load
    async function initAI() {
        try {
            statusText.innerText = "Loading AI Module (Inlined WASM)...";
            // The Jitsi sync package initializes via standard Emscripten execution
            if (typeof NoiseSuppressorWorklet === 'undefined' && window.CmarRnnoise) {
                 rnnoiseModule = await window.CmarRnnoise();
            } else {
                 rnnoiseModule = await createRnnoiseModule(); 
            }
            statusText.innerText = "AI Engine ready. Select an audio file.";
        } catch(e) {
            console.error(e);
            statusText.innerText = "Error configuring AI engine template pipeline.";
        }
    }
    
    // Run initialization
    window.addEventListener('DOMContentLoaded', initAI);

    uploadBtn.addEventListener('click', () => audioInput.click());

    audioInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "Loading audio file...";
        originalAudio.src = URL.createObjectURL(file);
        audioOutputs.style.display = 'block';

        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            statusText.innerText = "Audio loaded successfully. Ready to process.";
            processBtn.disabled = false;
        } catch (err) {
            statusText.innerText = "Error parsing file. Try a standard .wav or .mp3.";
            console.error(err);
        }
    });

    processBtn.addEventListener('click', async () => {
        if (!audioBuffer) return;
        processBtn.disabled = true;
        
        const sampleRate = audioBuffer.sampleRate;
        const inputData = audioBuffer.getChannelData(0); 
        const totalSamples = inputData.length;
        
        const frameSize = 480; 
        const outputData = new Float32Array(totalSamples);

        statusText.innerText = "Creating AI denoise state context...";
        // Create an instance state room for processing
        const denoiseState = rnnoiseModule.createDenoiseState();

        statusText.innerText = "Processing audio frames...";
        
        let offset = 0;
        
        // Asynchronous chunk loop to keep the UI fluid on mobile processors
        function processChunk() {
            const end = Math.min(offset + 19200, totalSamples); // run in bits of 4 frames
            
            while (offset < end) {
                const inputFrame = new Float32Array(frameSize);
                for (let i = 0; i < frameSize; i++) {
                    if (offset + i < totalSamples) {
                        inputFrame[i] = inputData[offset + i] * 32768; // Scale float to 16-bit PCM integer range
                    }
                }

                // Allocate memory in WASM heap stack arrays
                const wasmInputBuffer = rnnoiseModule._malloc(frameSize * 4);
                rnnoiseModule.HEAPF32.set(inputFrame, wasmInputBuffer / 4);

                // Run structural AI filtering vector calculations
                rnnoiseModule.processFrame(denoiseState, wasmInputBuffer, wasmInputBuffer);

                // Pull data back down out of the WASM heap segment allocation layout
                const cleanFrame = rnnoiseModule.HEAPF32.subarray(wasmInputBuffer / 4, wasmInputBuffer / 4 + frameSize);
                
                for (let i = 0; i < frameSize; i++) {
                    if (offset + i < totalSamples) {
                        outputData[offset + i] = cleanFrame[i] / 32768; // Normalize sound spectrum parameters back to standard float range
                    }
                }

                rnnoiseModule._free(wasmInputBuffer);
                offset += frameSize;
            }

            if (offset < totalSamples) {
                const progress = Math.round((offset / totalSamples) * 100);
                statusText.innerText = `Processing: ${progress}%...`;
                setTimeout(processChunk, 0);
            } else {
                finalizeAudio();
            }
        }

        function finalizeAudio() {
            statusText.innerText = "AI Processing complete! Creating playback file...";
            
            // Clean memory context configurations
            rnnoiseModule.destroyDenoiseState(denoiseState);

            const cleanBuffer = new AudioContext().createBuffer(1, totalSamples, sampleRate);
            cleanBuffer.getChannelData(0).set(outputData);
            
            const wavBlob = bufferToWav(cleanBuffer);
            cleanedAudio.src = URL.createObjectURL(wavBlob);
            
            statusText.innerText = "Done! Your clean audio track is ready.";
            processBtn.disabled = false;
        }

        // Start processing cycle
        processChunk();
    });

    function bufferToWav(buffer) {
        let numOfChan = buffer.numberOfChannels,
            length = buffer.length * numOfChan * 2 + 44,
            bufferArr = new ArrayBuffer(length),
            view = new DataView(bufferArr),
            channels = [], i, sample,
            offset = 0,
            pos = 0;

        setUint32(0x46464952); // "RIFF"
        setUint32(length - 8); 
        setUint32(0x45564157); // "WAVE"
        setUint32(0x20746d66); // "fmt " chunk
        setUint32(16);         
        setUint16(1);          
        setUint16(numOfChan);
        setUint32(buffer.sampleRate);
        setUint32(buffer.sampleRate * 2 * numOfChan); 
        setUint16(numOfChan * 2);                     
        setUint16(16);                                
        setUint32(0x61746164);                        
        setUint32(length - pos - 4);                  

        for(i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

        while(pos < length) {
            for(i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }

        return new Blob([bufferArr], { type: 'audio/wav' });

        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
    }
</script>

</body>
</html>
